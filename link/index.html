  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Aviso best-effort para navegadores in-app (Instagram/TikTok/Facebook).
    // No existe forma de forzar la apertura en Chrome/Safari desde una página
    // web -- eso lo decide la app que abrió el link. Esto es lo máximo posible:
    // en Android se ofrece un link que intenta abrir Chrome directo; en iPhone
    // solo se puede indicar el paso manual (limitación de Apple, no nuestra).
    (function () {
      var ua = navigator.userAgent || "";
      var isInApp = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|BytedanceWebview/i.test(ua);
      if (!isInApp) return;

      var banner = document.getElementById("browser-hint");
      var text = document.getElementById("browser-hint-text");
      var action = document.getElementById("browser-hint-action");
      var isIOS = /iphone|ipad|ipod/i.test(ua);

      if (isIOS) {
        text.textContent = 'Para mejor experiencia, tocá "···" arriba y elegí "Abrir en Safari".';
      } else {
        text.textContent = "Para mejor experiencia, abrí esto en Chrome.";
        var target = location.href.replace(/^https?:\/\//, "");
        action.href = "intent://" + target + "#Intent;scheme=https;package=com.android.chrome;end;";
        action.hidden = false;
      }
      banner.hidden = false;

      document.querySelector(".browser-hint-close").addEventListener("click", function () {
        banner.hidden = true;
      });
    })();
  </script>
